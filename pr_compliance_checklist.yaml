# Hard gates for OpenIPC firmware pull requests.
#
# These are binary pass/fail checks, deliberately narrow and objective. Nuanced,
# judgement-based review standards live in best_practices.md instead.
#
# Schema: https://docs.qodo.ai/v1/features/custom-compliance

pr_compliances:
  - title: "No LD_PRELOAD in shipped files"
    compliance_label: true
    objective: >
      Preload shims are not acceptable anywhere in the OpenIPC tree. They intercept a
      symbol for every caller, are invisible to anyone debugging the process, and freeze
      the underlying bug in place because the upstream maintainer never sees it.
    success_criteria: >
      The diff adds no LD_PRELOAD assignment or export to any script, package file, or
      overlay file. A bug in majestic is reported to majestic's maintainers; a bug in a
      vendor SDK is reported to the vendor.
    failure_criteria: >
      The diff adds LD_PRELOAD in general/overlay/, in general/package/*/files/, in an
      init script such as S95majestic, or in a .mk that writes one at install time.

  - title: "No binaries without a buildable source"
    compliance_label: true
    objective: >
      A blob taken out of a camera's stock image cannot be rebuilt for the next kernel,
      cannot be fixed, and is not known to work on any board other than the one it came
      off. Firmware built that way cannot be supported.
    success_criteria: >
      Any added .ko, .so, .a, .bin, or firmware image traces to a vendor SDK release or
      to a source tree the build system compiles. Existing vendor blobs may be moved or
      bumped.
    failure_criteria: >
      The diff adds a binary extracted from factory firmware, a binary generated by a
      script in the same PR, or any .ko/.so/.bin whose origin the PR cannot name. A
      PROVENANCE-style file documenting the absence of source is itself a failure.

  - title: "Package SITE is an OpenIPC or upstream repository"
    compliance_label: true
    objective: >
      Every board selecting a package inherits wherever that package points. A personal
      fork can be force-pushed, made private, or deleted, breaking every board at the
      next clean build, and it puts unreviewed code into images carrying the project name.
    success_criteria: >
      Added or changed *_SITE values name an OpenIPC-org repository or a documented
      upstream project. Landing the change upstream first and bumping the version here
      is the sanctioned route.
    failure_criteria: >
      The diff points a *_SITE at a personal user account, for example
      $(call github,<username>,<repo>,...) where <username> is not openipc and is not the
      package's established upstream.

  - title: "Version pins do not loosen, and help text agrees with SITE"
    compliance_label: true
    objective: >
      Help text naming a different source than the .mk fetches gives anyone auditing
      provenance the wrong answer. A pin that gets less specific than the value it
      replaces silently widens what a clean build may fetch.
    success_criteria: >
      A bumped *_VERSION keeps at least the specificity of the value it replaces, and any
      Config.in help text, README, or comment naming the source matches the *_SITE the
      .mk actually fetches. Note the tree's conventions differ per package: most pin a
      full 40-character SHA, hisilicon-opensdk pins an 8-character short SHA, and several
      packages track HEAD. Keeping a package's established format is not a finding.
    failure_criteria: >
      The diff sets a *_VERSION to fewer hex characters than the value it replaces, or
      replaces a commit pin with a branch name, or changes a *_SITE while leaving help
      text or comments naming the previous source. Prefer a full 40-character SHA only
      for a newly added package.

  - title: "No device-specific values in generic configuration"
    compliance_label: true
    objective: >
      general/overlay/ is copied into every image and load_<vendor> scripts serve a whole
      SoC family. A value true only of the contributor's bench becomes the default for
      cameras already deployed, which pick it up at upgrade time and lose video.
    success_criteria: >
      Files under general/overlay/ stay board-agnostic and continue to derive per-board
      behaviour from autodetection or configuration. Adding sensor support to a load
      script is expected and passes as long as it is additive — extending an existing
      case arm, adding a new .ini, or adding an entry to a package's sensor list, none of
      which change an existing board's behaviour.
    failure_criteria: >
      The diff writes a sensor name, I2C address, GPIO number, resolution, MAC prefix, or
      IP literal into general/overlay/, or changes an existing SNS_TYPE*, default
      resolution, or default profile in a shared *-osdrv-*/files/script/load_<vendor>.

  - title: "Toolchain-wide flags are justified and measured"
    compliance_label: true
    objective: >
      BR2_TARGET_OPTIMIZATION and BR2_TARGET_LDFLAGS are injected into every compilation
      unit a board builds, so they are whole-image codegen and ABI changes presented as a
      one-line defconfig edit.
    success_criteria: >
      Any added or changed BR2_TARGET_OPTIMIZATION, BR2_TARGET_LDFLAGS, or
      BR2_GLOBAL_PATCH_DIR names the symptom it fixes and reports a before/after image
      size and a boot check on the affected board. A fix scoped to one package is
      preferred.
    failure_criteria: >
      The diff adds or changes one of these values with no named symptom and no
      before/after measurement from real hardware.

  - title: "New sources are wired into the build"
    compliance_label: true
    objective: >
      Code that no defconfig selects is never compiled by CI, so nothing proves it
      builds, let alone runs. It ships in no image and rots.
    success_criteria: >
      Added source files belong to a package with a Config.in entry and a <pkg>.mk that
      builds and installs them, and at least one defconfig selects that package. Data
      files added under a path an existing install rule already globs — for example a new
      .ini under files/sensor/config/ installed by a *.ini wildcard — need no .mk change
      and pass.
    failure_criteria: >
      The diff adds .c, .py, or script files with no Config.in entry, no .mk rule, and no
      defconfig selecting them — for example a new top-level tools/ directory.

  - title: "No kernel patches in this repository"
    compliance_label: true
    objective: >
      general/package/all-patches/linux/ carries patches that have already been through
      kernel review. A new patch landed here is invisible to everyone working on the
      kernel and is dropped at the next kernel bump.
    success_criteria: >
      The diff adds no new patch under general/package/all-patches/linux/. Kernel changes
      are opened against OpenIPC/linux, after which no patch is needed here.
    failure_criteria: >
      The diff adds a device-tree, driver, or any other kernel patch file under
      general/package/all-patches/linux/.

  - title: "No single-board support in the shared tree"
    compliance_label: true
    objective: >
      Support for one retail camera model is dead weight for the other boards and is not
      covered by this repository's CI matrix. general/overlay/usr/sbin/sysupgrade already
      routes lite|ultimate|neo to firmware and every other variant to builder.
    success_criteria: >
      Added packages and scripts apply to an SoC family. Work specific to one retail model
      is opened against OpenIPC/builder under devices/common/br-ext-chip-<vendor>/ with a
      per-board defconfig.
    failure_criteria: >
      The diff adds a file whose name or content targets exactly one board, or the author
      states the package must not be enabled on generic SoC defconfigs, or it collides
      with an existing first-class package at the same installed path.

  - title: "No runtime patching of vendor code"
    compliance_label: true
    objective: >
      Offsets into a vendor blob are valid for one build of that blob. The next vendor
      release moves them, and the result is not a clean failure but memory corruption on
      a camera nobody can reach.
    success_criteria: >
      Added code calls documented vendor SDK entry points. Fixes to vendor behaviour are
      raised with the vendor or implemented in the open SDK.
    failure_criteria: >
      The diff adds code that writes into another module's data section, resolves a
      vendor symbol through kallsyms in order to patch it, or hooks a vendor function at
      runtime.

  - title: "Shipped scripts follow tree conventions"
    compliance_label: true
    objective: >
      The tree standardised on modprobe so module dependencies resolve, and on open_*
      naming for OpenSDK modules that replace vendor-prefixed blobs. Both are mechanical
      and checkable from the diff.
    success_criteria: >
      Shell scripts that ship in the image load kernel modules with modprobe, and OpenSDK
      modules are named open_* rather than with a vendor-specific prefix. This gate
      applies only to files installed onto a camera — general/overlay/ and
      general/package/*/files/. Scripts under .github/ and contrib/ run on CI runners or
      a developer's machine under bash and are out of scope.
    failure_criteria: >
      The diff calls insmod where the surrounding tree uses modprobe, or introduces an
      OpenSDK module under a vendor-prefixed name such as gk7205v200_* or hi3516ev200_*.
      Do not raise this for anything under .github/ or contrib/. Do not raise shell
      portability here: syntax is already enforced by .github/workflows/shell-tests.yml
      against busybox ash, and "avoid bashisms" is not binary on this target — the shipped
      busybox sets CONFIG_ASH_BASH_COMPAT=y, so constructs a portability linter would
      reject are valid in the field. That judgement lives in best_practices.md §7.1.

  - title: "Hardware evidence is present and honest"
    compliance_label: true
    objective: >
      CI proves an image builds; only the contributor's hardware can prove it boots and
      streams. The evidence in the description is therefore part of the change under
      review, and an unchecked box asserts verification that did not happen.
    success_criteria: >
      A PR that can alter an image names the symptom and the affected board, and shows
      before/after output — logs, dmesg, stream behaviour, or measurements — from a real
      camera. Any checkbox under a test or verification heading is checked. A PR that
      cannot reach an image says so plainly and gives the evidence its change class does
      admit: a self-test, selector output, a parse run.
    failure_criteria: >
      The description leaves checkboxes unchecked under a test or verification heading,
      states the change was not tested on hardware, or hedges with "should work",
      "untested but", or "in theory" in place of output from a board — and the diff can
      change what the firmware does on a camera. Claiming hardware testing that did not happen
      fails this gate whatever the diff touches.
      "Can change what the firmware does on a camera" is the entire test, and it is about
      behaviour, not bytes. Every build stamps the commit SHA, build id and a timestamp
      into /usr/lib/os-release, so by a byte measure every commit alters every image and
      this gate would be unsatisfiable again; those provenance stamps do not count. The
      lists below are examples, not the definition, and a path fitting neither is not
      exempt — the same fail-safe direction ci-matrix.py takes when an unrecognised path
      widens the matrix rather than narrowing it.
      Exempt: documentation; review configuration; repository metadata; the pull request
      template; CODEOWNERS; and CI machinery that only selects, lints or tests, such as
      ci-matrix.py, the test_ and lint- scripts, check_target_modules.sh, and the workflows
      that run them.
      Not exempt, though they look it. A defconfig CI does not build is still a real
      image and needs more evidence than one CI builds, not less, because CI supplies none
      for it — so a zero-board ci-matrix.py result is not proof a diff reaches no image.
      A workflow that sets a build input changes image bytes. And the post-build machinery
      — general/scripts/rootfs_script.sh with late-overlays.list,
      late-post-build-hooks.list and the excludes lists — rewrites every rootfs the tree
      builds.
