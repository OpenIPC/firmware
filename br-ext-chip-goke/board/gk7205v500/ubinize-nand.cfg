# gk7205v500-family NAND: kernel (FIT) + rootfs (UBIFS) + rootfs_data.
# Boots with u-boot-xmedia's FIT NAND env: `ubi read ${baseaddr} kernel; bootm`
# and root=ubi0:rootfs. sysupgrade rewrites `kernel` and `rootfs` in place
# with ubiupdatevol, so their sizes are the ceiling for future images.
[kernel]
mode=ubi
vol_id=0
vol_type=dynamic
vol_name=kernel
vol_alignment=1
vol_size=4MiB
image=BINARIES_DIR/fitImage

[rootfs]
mode=ubi
vol_id=1
vol_type=dynamic
vol_name=rootfs
vol_alignment=1
vol_size=32MiB
image=BR2_ROOTFS_UBIFS_PATH

[rootfs_data]
mode=ubi
vol_id=2
vol_type=dynamic
vol_name=rootfs_data
vol_alignment=1
vol_size=2MiB
vol_flags=autoresize
