# AX620U NAND (128 MiB SPI NAND): rootfs (UBIFS, the kernel inside as
# /boot/fitImage) + rootfs_data. the stock Xiongmai/Axera U-Boot boots it with
# `ubi part ubi; ubifsmount ubi0:rootfs; ubifsload 0x42800000 /boot/fitImage; bootm 0x42800000` and root=ubi0:rootfs.
#
# No vol_size here: the build adds one, the image plus 4 MiB of headroom
# (general/external.mk), and the overlay takes everything else. sysupgrade
# resizes both when it writes a new rootfs, so neither size is a limit a future
# image has to fit; the headroom lets U-Boot's `run ur` write a grown image
# without dropping the overlay.
[rootfs]
mode=ubi
vol_id=0
vol_type=dynamic
vol_name=rootfs
vol_alignment=1
image=BR2_ROOTFS_UBIFS_PATH

[rootfs_data]
mode=ubi
vol_id=1
vol_type=dynamic
vol_name=rootfs_data
vol_alignment=1
vol_size=2MiB
vol_flags=autoresize
