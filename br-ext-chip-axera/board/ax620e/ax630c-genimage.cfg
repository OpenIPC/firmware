# Sipeed MaixCAM2 SD card (support/scripts/genimage.sh, ax630c_lite):
# p1 FAT16 "BOOT" with the kernel and its DTB, p2 the ext4 rootfs, mounted
# read-write with root=/dev/mmcblk1p2 rootfstype=ext4 rw rootwait.

image boot.vfat {
	vfat {
		extraargs = "-F 16"
		label = "BOOT"
		files = {
			"Image",
			"ax630c-maixcam2.dtb"
		}
	}
	size = 32M
}

image sdcard.img {
	hdimage {
	}

	partition boot {
		partition-type = 0xE
		bootable = "true"
		offset = 1M
		image = "boot.vfat"
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext4"
	}
}
