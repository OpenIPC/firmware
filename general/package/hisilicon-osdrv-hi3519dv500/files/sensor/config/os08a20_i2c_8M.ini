; OS08A20 (and OS08A10, which answers with the same ID) on SENSOR0 of the
; Hi3519DV500 reference board, 4 lanes. majestic moves it to the connector it
; is found on: on SENSOR1 it runs on I2C5, MIPI RX port 2, lanes 4-7, VI dev 2.
[sensor]
Sensor_type=g_sns_os08a20_obj
Mode=WDR_MODE_NONE
DllFile=libsns_os08a20.so
I2cDev=4

[mode]
input_mode=INPUT_MODE_MIPI
raw_bitness=12

[mipi]
lane_id = 0|1|2|3|-1|-1|-1|-1|
lane_divide_mode = 1

[isp_image]
Isp_FrameRate=30
Isp_Bayer=BAYER_BGGR

[vi_dev]
Input_mod=VI_MODE_MIPI
Work_mod=VI_WORK_MODE_1Multiplex
Mask_num=2
Mask_0=0xFFF00000
Mask_1=0x0
Scan_mode=VI_SCAN_PROGRESSIVE
Data_seq=VI_DATA_SEQ_YUYV
InputDataType=1
DataRev=FALSE
DevRect_w=3840
DevRect_h=2160
DevRect_x=0
DevRect_y=0
