; OS08A20 on the SENSOR1 connector of the Hi3519DV500 DMEBPRO kit, for
; majestic's second sensor (isp.sensor1Config). Named s1_ so that the SENSOR0
; lookup by sensor name (/etc/sensors/<sensor>*) never picks it.
; Needs `fw_setenv sensor1 os08a20`, which makes load_hisilicon mux I2C5.
; SENSOR0 and SENSOR1 split the MIPI RX 4+4 (lane_divide_mode = 1 in both).
[sensor]
Sensor_type=g_sns_os08a20_obj
Mode=WDR_MODE_NONE
DllFile=libsns_os08a20.so
I2cDev=5

[mode]
input_mode=INPUT_MODE_MIPI
raw_bitness=12

[mipi]
; MIPI RX dev 2, lanes 4..7; 4+4 lane split shared with sensor 0
devno=2
lane_id = 4|5|6|7|-1|-1|-1|-1|
lane_divide_mode = 1
sns_clk_src=1
sns_rst_src=1

[isp_image]
Isp_FrameRate=30
Isp_Bayer=BAYER_BGGR

[vi_dev]
dev=2
Input_mod=VI_MODE_MIPI
Work_mod=VI_WORK_MODE_1Multiplex
Mask_num=2
Mask_0=0xFFF00000
Mask_1=0x0
Scan_mode=VI_SCAN_PROGRESSIVE
Data_seq=VI_DATA_SEQ_YUYV
InputDataType=1
DataRev=FALSE
DevRect_w=3840
DevRect_h=2160
DevRect_x=0
DevRect_y=0
