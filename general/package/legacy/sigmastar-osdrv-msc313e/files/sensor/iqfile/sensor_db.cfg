; SigmaStar infinity3 sensor list, read by libCamSensor as /data/cfg/sensor_db.cfg
; (load_mstar bind-mounts this directory there). It probes [SENSOR1],
; [SENSOR2], ... in order and keeps the first whose chip ID answers, so one list
; serves every board.
;
; SENSOR_IO_PAD, MCLK and the crop are board wiring. JX-F22 and SC2235 carry the
; values of a retail MSC313E camera that runs them; IMX307 and IMX323 those of
; the SDK's reference list (ISP/cfg/sensor_db.cfg), not yet seen on a camera.
; A device that differs ships its own copy of this file from OpenIPC/builder.

[I2C]
BUS_TYPE=ISP_I2C_EXTERNAL_1

[SENSOR1]
LIB=/usr/lib/sensors/libdrv_ms_cus_JXF22.so
IQ_FILE_NAME=f22_iqfile.bin.mz
F_NUMBER=18
MIRROR=0
FLIP=0
CROP_START_X = 0
CROP_START_Y = 0
ISP_CLK=86
SENSOR_IO_PAD=2
MCLK=ISP_27M
SENSOR_SHFT=0;

[SENSOR2]
LIB=/usr/lib/sensors/libdrv_ms_cus_sc2235_2.so
IQ_FILE_NAME=sc2235_iqfile.bin.mz
F_NUMBER=18
MIRROR=0
FLIP=0
CROP_START_X = 0
CROP_START_Y = 0
ISP_CLK=86
SENSOR_IO_PAD=2
MCLK=ISP_27M
SENSOR_SHFT=2;

[SENSOR3]
LIB=/usr/lib/sensors/libdrv_ms_cus_imx307_MIPI.so
IQ_FILE_NAME=imx307_iqfile.bin.mz
F_NUMBER=18
MIRROR=0
FLIP=0
CROP_START_X = 12
CROP_START_Y = 10
ISP_CLK=86
SENSOR_IO_PAD=6
MCLK=ISP_36M

[SENSOR4]
LIB=/usr/lib/sensors/libdrv_ms_cus_imx323.so
IQ_FILE_NAME=imx323_iqfile.bin.mz
F_NUMBER=18
MIRROR=0
FLIP=0
CROP_START_X = 106
CROP_START_Y = 19
SENSOR_IO_PAD=6
MCLK=ISP_36M
ISP_CLK=86
