# The UI plane (fb0) above the video: 1280x720 ARGB8888 (FB_HWWIN_FORMAT 5),
# the size of vigil's screen and of the 720p60 output. fbdev.ko reads this
# once, at load.
[FB_DEVICE]
FB_HWLAYER_ID = 1
FB_HWWIN_ID = 0
FB_HWLAYER_DST = 3
FB_HWWIN_FORMAT = 5
FB_HWLAYER_OUTPUTCOLOR = 1
FB_WIDTH = 1280
FB_HEIGHT = 720
FB_TIMMING_WIDTH = 1280
FB_TIMMING_HEIGHT = 720
FB_MMAP_NAME = E_MMAP_ID_FB
FB_BUFFER_LEN = 8192
#unit:Kbyte,4096=4M, fbdev.ko alloc size = FB_BUFFER_LEN*1024

[FB_CURSOR]
FB_HWLAYER_ID = 0
FB_HWWIN_ID = 0
FB_HWLAYER_DST = 3
FB_HWWIN_FORMAT = 5
FB_HWLAYER_OUTPUTCOLOR = 1
FB_MMAP_NAME = E_MMAP_ID_HW_CURSOR

[LAYER_ZORDER]
LAYER_ZORDER0 = 0
LAYER_ZORDER1 = 1
LAYER_ZORDER2 = 2
LAYER_ZORDER3 = 3
LAYER_ZORDER4 = 4
