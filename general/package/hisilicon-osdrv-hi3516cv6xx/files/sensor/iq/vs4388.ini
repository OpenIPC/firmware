; ViSemi VS4388 on Hi3516CV610/CV608: the scene_auto tuning the vendor's own
; firmware runs on this sensor (its sensor/vs4388/day.ini by day and night.ini
; by night, stored obfuscated on the camera), in majestic's one-file form:
; the day half unprefixed, the night half as ir_*.
;
; Trimmed to the sections majestic reads on gen 5. The vendor's night file
; carries only what changes under IR; every other section keeps its day
; values at night, as on the vendor's firmware. Its [static_3dnr] is left
; out: it is keyed by temperature as well as ISO, in a text format majestic
; does not read. [module_state] is the day file's.
;
; A few rows are long or short of their sixteen-ISO table in the vendor's
; files; they are written here as the CV610 SDK's loader reads them: the
; first sixteen of a long row, a short one completed with 0.
; One NR row (user_define_dark_thresh) has a comma missing, "240 240",
; which that loader reads as a single 240.

