; Sony IMX415 on Hi3516CV610/CV608: the day scene the vendor's own firmware
; applies to this sensor, recovered from the stock firmware of a SIP-K662C6S
; module (xipc: IMX415_Set_ISP_DayDefultParam, sub_5409E, and
; IMX415_ISP_SetBNRAttr, sub_53C7E), in majestic's one-file form.
;
; The vendor keeps it as code, not text: it reads each ISP attribute, patches
; some fields and writes it back, so everything it leaves alone stays as the
; sensor driver set it. A key absent here does the same.
;
; Carried: AE pace (ae_route_ex_valid, auto_speed), the AE route, saturation,
; dynamic DPC (strength and blend ratio), and the Bayer NR fields the vendor
; writes. The NR fields are placed by name: the vendor's NR structure lacks
; load_ref_en and snr_version, so its byte offsets past them are 8 short of
; this SDK's.
;
; Left out, having no key in majestic's gen-5 profile: the AE gain threshold,
; EV bias, black speed bias and sensor digital-gain ceiling; the DPC bright
; and dark strengths; and, whole, dehaze, white balance and colour matrix,
; black level. Majestic's dehaze section has no strength key, and the
; strengths are what the vendor sets.
;
; Also left out: sixteen 32-bit writes the vendor makes inside the NR motion
; block, which match no field of this SDK's structure.

[module_state]
bStaticAE = "1"
bStaticNr = "1"
bStaticDPC = "1"
bStaticSaturation = "1"

[static_ae]
ae_route_ex_valid = "1"
auto_speed = "64"

[static_aerouteex]
total_num = "5"
int_time  = "25, 50000, 50000, 83333, 83333"
again     = "1024, 1024, 190464, 190464, 190464"
dgain     = "1024, 1024, 1024, 1024, 1024"
isp_dgain = "1024, 1024, 1024, 1024, 131072"

