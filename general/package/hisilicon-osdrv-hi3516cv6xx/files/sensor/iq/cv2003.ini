; Cvsens CV2003 on Hi3516CV610/CV608: the scene_auto tuning the vendor's own
; firmware runs on this sensor (its sensor/cv2003/day.ini by day and
; night.ini by night, stored obfuscated on the camera), in majestic's
; one-file form: the day half unprefixed, the night half as ir_*.
;
; Trimmed to the sections majestic reads on gen 5. The vendor's night file
; carries only what changes under IR (sharpen, DPC, gamma); every other
; section keeps its day values at night, as on the vendor's firmware. Its
; [static_3dnr] is left out: it is keyed by temperature as well as ISO, in a
; text format majestic does not read.
; [module_state] is the day file's.
;
; A few rows (sharpen's luma_wgt_21..31, max_sharp_gain and edge_overshoot,
; NR's sfm0_coarse_strength_3, LDCI's auto_he_pos_mean) are one or two
; values long or short of their sixteen-ISO table in the vendor's files.
; They are written here at sixteen, as the CV610 SDK's loader reads them: the
; first sixteen of a long row, a short one completed with 0.

