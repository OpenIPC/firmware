; SmartSens SC500AI on Hi3516CV610/CV608: the day scene the vendor's own
; firmware applies to this sensor, recovered from the stock firmware of a
; SIP-K662C6S module (xipc: SC500AI_Set_ISP_DayDefultParam, sub_61766, and
; SC500AI_ISP_SetBNRAttr, sub_60F64), in majestic's one-file form.
;
; The vendor keeps it as code, not text: it reads each ISP attribute, patches
; some fields and writes it back, so everything it leaves alone stays as the
; sensor driver set it. A key absent here does the same.
;
; Carried: AE pace (auto_speed), the AE route, saturation, dynamic DPC
; (strength and blend ratio), and the Bayer NR fields the vendor writes. The
; NR fields are placed by name: the vendor's NR structure lacks load_ref_en
; and snr_version, so its byte offsets past them are 8 short of this SDK's.
;
; The vendor writes the route but never sets ae_route_ex_valid, so its AE does
; not follow it; nor does majestic's, from this file.
;
; Left out, having no key in majestic's gen-5 profile: the AE gain threshold,
; EV bias, black speed bias and sensor digital-gain ceiling; the DPC bright
; and dark strengths; and, whole, dehaze, white balance and colour matrix.
; Majestic's dehaze section has no strength key, and the strengths are what
; the vendor sets.
;
; Also left out: 16 bytes the vendor sets to 1 inside the NR motion block,
; where this SDK keeps user_define_md. The other K662C6S sensors make sixteen
; 32-bit writes there instead, which match no field here, so which field the
; vendor means is not settled.

[module_state]
bStaticAE = "1"
bStaticNr = "1"
bStaticDPC = "1"
bStaticSaturation = "1"

[static_ae]
auto_speed = "32"

[static_aerouteex]
