; IMX415 at night under infrared: laid over imx415.bin, last, while the
; night picture is grey. A camera that stays in colour at night never
; loads it.
;
; These are the three changes an IMX415 tuning from a camera vendor
; (Anjoy, Infinity6E) makes between its day file and its infrared night
; file that mean the same thing on Infinity6C. Its sharpness and luma
; noise-reduction changes have no Infinity6C counterpart, and its
; saturation and noise tables were tuned against a different day file
; than this one, so they are left out. Not yet measured on an IMX415
; camera: reports from infrared scenes are what will tune it.

; Infrared carries no colour to keep. With nightMode.colorToGray on,
; majestic sets this itself.
[IQ_COLORTOGRAY]
bEnable = 1

; The day matrix pulls colours apart with negative terms. Under
; infrared that only amplifies noise, so the night file passes the
; channels through unchanged.
[IQ_CCM]
enOpType = 1
stManual.u16CCM = 1024, 0, 0, 1024, 0, 1024, 0, 1024, 0, 0, 1024, 1024

; 32x sensor gain, where the day file allows 256x: the infrared lamps
; light the near field, and past that gain buys noise, not detail.
[AE_EXPOSURE_LIMIT]
u32MaxSensorGain = 32768
