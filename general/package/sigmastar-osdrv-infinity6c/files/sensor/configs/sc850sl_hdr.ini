; SC850SL in sensor HDR (isp.wdrMode): laid over sc850sl.bin, a linear
; tuning, when the sensor runs its HDR mode. Measured on an MC-J86
; (SSC378DE) against a ColorChecker, 3060 K: grey patch Y 113 -> 146
; (linear 162), SNR 52 -> 121, black patch 32 -> 44 without the purple
; cast the linear bin leaves in the shadows.
;
; The short frame's black level: the linear bin leaves it off, and its
; offset then survives the merge as a lift and a cast. It takes the
; long frame's values: both frames come off the same pixels.

[IQ_BLACK_LEVEL_P1]
bEnable = 1
stAuto.stParaAPI[0].u16ValR = 4350
