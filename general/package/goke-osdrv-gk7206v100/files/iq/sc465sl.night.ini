; SC465SL night (IR, black and white) tuning: what the vendor's firmware
; changes when it switches to IR night, as a delta over the day profile
; (sc465sl.ini). The streamer applies it when night mode turns the picture
; grey and puts the day sections back at dawn.
;
; Read from Xiongmai's IPC_GK7206V11_K8 App (V1.10.T02.20261103): its ISP
; code run under Unicorn (OpenIPC/qemu-bench tools/xm-isp-tuning,
; xm-isp-capture.py) with its day/night switch called with night (0) and
; day (1); the day run reproduces the day profile, the difference is this
; file. DRC strength is the App's night DRC table for this sensor. AE
; compensation is not here: the App rewrites it as gain moves, so the day
; table (fitted to the stock camera) stays in force.

