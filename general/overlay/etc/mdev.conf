# Provide user, group, and mode information for devices.  If a regex matches
# the device name provided by sysfs, use the appropriate user:group and mode
# instead of the default 0:0 660.
#
# Syntax:
# [-]devicename_regex user:group mode [=path]|[>path]|[!] [@|$|*cmd args...]
# [-]$ENVVAR=regex    user:group mode [=path]|[>path]|[!] [@|$|*cmd args...]
# [-]@maj,min[-min2]  user:group mode [=path]|[>path]|[!] [@|$|*cmd args...]
#
# [-]: do not stop on this match, continue reading mdev.conf
# =: move, >: move and create a symlink
# !: do not create device node
# @|$|*: run@cmd if $ACTION=add,  $cmd if $ACTION=remove, *cmd in all cases
#

mmcblk[0-9] root:disk 660 *(/lib/mdev/automount.sh)
mmcblk[0-9]p[0-9] root:disk 660 *(/lib/mdev/automount.sh)

sd[a-z] root:disk 660 *(/lib/mdev/automount.sh)
sd[a-z][0-9] root:disk 660 *(/lib/mdev/automount.sh)

# USB tethering: a phone, or a modem in RNDIS, ECM or NCM mode. The kernel
# builds these drivers as modules and nothing else loads them, so a phone that
# tethered gave no usb0 at all (#1112). The classes are the drivers' own; a
# blanket MODALIAS rule would also load usbserial for a modem before
# rndis_host, which /etc/wireless/modem exists to prevent.
$MODALIAS=usb:.*ic(E0isc01ip03|EFisc01ip01|02isc02ipFF|02isc06ip00|02isc0Dip00)in.* root:root 660 @modprobe -q "$MODALIAS"
$INTERFACE=usb0 root:root 660 ! *(/lib/mdev/usbnet.sh)
