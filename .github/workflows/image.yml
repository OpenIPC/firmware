name: image
on:
  workflow_run:
    workflows: [build]
    types: [completed]
  workflow_dispatch:
    inputs:
      build_id:
        description: 'Build ID to assemble (e.g. nightly-20260520-887328c). Default: the newest dated release.'
        required: false

permissions:
  contents: write

jobs:
  toolchain:
    name: Image
    runs-on: ubuntu-latest
    # Run after nightly (schedule) or operator dispatch only — PR builds do
    # not produce new release assets, so reassembling images on every PR
    # build is wasted compute. Mirrors the gate in manifest.yml.
    #
    # Publish on success AND on partial-failure: see manifest.yml rationale.
    # A flaky board doesn't deny image assembly for the platforms that did
    # upload a firmware tgz — firmware_url returns empty for missing ones and
    # create() skips them.
    #
    # First clause: on a mirror the nightly's jobs skip, but the run still
    # completes and fires workflow_run, so gate the cron-originated path on
    # the canonical repo too — see build.yml's preflight. Dispatch-driven
    # reassembly is untouched anywhere.
    if: >-
      (github.event.workflow_run.event != 'schedule' ||
       github.repository == 'OpenIPC/firmware') &&
      (github.event_name == 'workflow_dispatch' ||
       ((github.event.workflow_run.event == 'schedule' ||
         github.event.workflow_run.event == 'workflow_dispatch') &&
        contains(fromJSON('["success", "failure"]'), github.event.workflow_run.conclusion)))
    env:
      SIGMASTAR: ssc30kd ssc30kq ssc325 ssc333 ssc335 ssc335de ssc337 ssc337de ssc338q ssc377 ssc377d ssc377de ssc377qe ssc378de ssc378qe
      INGENIC: t10 t10l t20 t20l t20x t21n t23n t30a t30a1 t30l t30n t30x t31a t31al t31l t31lc t31n t31x
      ALLWINNER: v851s
      # U-Boot is not part of a nightly: uboot.yml publishes it to `latest` on
      # its own schedule, so every image carries the current bootloader.
      UBOOT_URL: https://github.com/openipc/firmware/releases/download/latest

    steps:
      # The build is resolved from the dated release the triggering run
      # published, never from manifest.json. manifest.yml fires on the same
      # build completion with nothing ordering the two, and its output reaches
      # openipc.github.io only after a Pages deploy and the CDN's cache, so
      # reading channels.nightly here took the previous night's kernel and
      # rootfs under the current U-Boot (#2679). build.yml creates the dated
      # release, body `sha=<HEAD>`, before its run completes, so the head SHA
      # always finds it. The tag carries a short SHA, and a WebUI-only rebuild
      # reuses it under a new date, so take the newest and check the full SHA.
      - name: Resolve the build to assemble
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          INPUT_BUILD_ID: ${{ inputs.build_id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -eu
          # The release API has flaky days on workflow_run jobs (see
          # enrich_manifest.py's retry), and one failed call here would leave
          # the image tag a night behind again.
          gh_retry() {
            local n=0 delay=10
            until "$@"; do
              n=$((n + 1))
              if [ "$n" -ge 4 ]; then
                echo "::error::gh failed after 4 attempts: $*" >&2
                return 1
              fi
              echo "::warning::gh attempt ${n} failed, retrying in ${delay}s" >&2
              sleep "$delay"
              delay=$((delay * 2))
            done
          }

          dated='^nightly-[0-9]{8}-[0-9a-f]{7}$'
          SHA=
          if [ -n "$INPUT_BUILD_ID" ]; then
            # Only a dated release is one build. `nightly` and `latest` keep
            # the previous image of every board that failed to build, so
            # assembling from them mixes generations under one name.
            if ! printf '%s\n' "$INPUT_BUILD_ID" | grep -Eq "$dated"; then
              echo "::error::build_id must be a dated release (nightly-YYYYMMDD-<short>), not '$INPUT_BUILD_ID'"
              exit 1
            fi
            BUILD_ID="$INPUT_BUILD_ID"
          else
            if [ -n "$HEAD_SHA" ]; then
              re="^nightly-[0-9]{8}-${HEAD_SHA:0:7}\$"
              SHA="$HEAD_SHA"
            else
              re="$dated"
            fi
            BUILD_ID=$(gh_retry gh release list --limit 200 --json tagName,createdAt \
              --jq "[.[] | select(.tagName | test(\"$re\"))] | sort_by(.createdAt) | last | .tagName // empty")
          fi
          if [ -z "$BUILD_ID" ]; then
            echo "::error::no dated release found for ${SHA:-the newest build}; refusing to assemble another build's images"
            exit 1
          fi
          gh_retry gh release view "$BUILD_ID" --json body,assets > /tmp/release.json
          GOT=$(jq -r '.body // "" | split("\n") | map(select(startswith("sha="))) | first // "" | ltrimstr("sha=")' /tmp/release.json)
          if [ -z "$GOT" ]; then
            echo "::error::$BUILD_ID records no sha=; not a release build.yml published"
            exit 1
          fi
          if [ -n "$SHA" ] && [ "$GOT" != "$SHA" ]; then
            echo "::error::$BUILD_ID was built from $GOT, not $SHA"
            exit 1
          fi
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          echo "sha=$GOT" >> "$GITHUB_OUTPUT"
          echo "Assembling images for $BUILD_ID (sha=$GOT)"

      - name: Prepare
        env:
          BUILD_ID: ${{ steps.resolve.outputs.build_id }}
        run: |
            # firmware_url <firmware_soc> <variant> [<flash>]
            #   -> echoes the <flash> (default nor) package URL for
            #      ${firmware_soc}_${variant} on the $BUILD_ID release, or
            #      nothing if that build did not publish one. nor_split is the
            #      split NOR package, openipc.<soc>-nor-<variant>-split.tgz.
            firmware_url() {
                local name
                case "${3:-nor}" in
                  nor_split) name="openipc.$1-nor-$2-split.tgz" ;;
                  *) name="openipc.$1-${3:-nor}-$2.tgz" ;;
                esac
                jq -r --arg n "$name" '.assets[] | select(.name==$n) | .url' /tmp/release.json
            }

            # create <uboot_board> <firmware_soc> <variant>
            #   The two SoC arguments differ for Ingenic: u-boot is per
            #   board (t31al, t31lc, ...), firmware is per family (t31).
            create() {
              uboot=u-boot-$1-nor.bin
              release=target/openipc-$1-nor-$3.bin

              mkdir -p output target
              if ! wget -nv "$UBOOT_URL/$uboot" -O "output/$1.bin"; then
                echo -e "Download failed: $UBOOT_URL/$uboot\n"
                return 0
              fi

              url=$(firmware_url "$2" "$3")
              if [ -z "$url" ]; then
                echo -e "Skip: no firmware in $BUILD_ID for ${2}_${3}\n"
                return 0
              fi
              if ! wget -nv "$url" -O "output/$2.tgz"; then
                echo -e "Download failed: $url\n"
                return 0
              fi

              tar -xf output/$2.tgz -C output
              dd if=/dev/zero bs=1K count=5000 status=none | tr '\000' '\377' > $release
              dd if=output/$1.bin of=$release bs=1K seek=0 conv=notrunc status=none
              dd if=output/uImage.$2 of=$release bs=1K seek=320 conv=notrunc status=none
              dd if=output/rootfs.squashfs.$2 of=$release bs=1K seek=2368 conv=notrunc status=none
              rm -rf output

              echo -e "Created: $release\n"
            }

            # create_split <boot_image> <firmware_soc> <variant> <release_tag> <nor_kib>
            #   The split NOR layout (hi3516cv6xx, hi3519dv500): the signed boot
            #   image -- GSL, DDR table and U-Boot, published once per DDR
            #   binning -- at 0, the package's firmware.bin (a uImage, then the
            #   squashfs at the next 64 KiB) where the boot area ends, and the
            #   rest of the part erased. Any U-Boot boots it: the kernel finds
            #   its own partitions (mtdsplit), and rootfs_data starts where the
            #   image ends. So only the whole has to fit the part, with an erase
            #   block to spare for the settings; there are no slots to measure
            #   it against. Except the uImage: bootloaders in the field read a
            #   fixed amount from the firmware offset to boot it (the
            #   BR2_OPENIPC_NOR_KERNEL_READ_SIZE the build checks), and one
            #   past it is read short. The boot area and that read are the
            #   board's, and the only things here that differ between SoCs.
            split_layout() {
              case "$1" in
                hi3516cv6xx) boot_kib=256 env_kib=64 read_kib=2048 ;;
                hi3519dv500) boot_kib=512 env_kib=256 read_kib=6144 ;;
                *) echo "::error::create_split: no NOR boot area known for $1"; return 1 ;;
              esac
            }

            create_split() {
              local uboot="$1" soc="$2" variant="$3" tag="$4" nor="$5"
              local release="target/openipc-${tag}-nor-${variant}.bin"
              local boot_kib env_kib read_kib off fw fw_kib ub_kib ksz k_kib used end_kib got
              split_layout "$soc" || return 1
              off=$(( boot_kib + env_kib ))

              rm -rf output; mkdir -p output target
              if ! wget -nv "$UBOOT_URL/$uboot" -O "output/$uboot"; then
                echo -e "Download failed: $UBOOT_URL/$uboot\n"
                return 0
              fi

              url=$(firmware_url "$soc" "$variant" nor_split)
              if [ -z "$url" ]; then
                echo -e "Skip: no split package in $BUILD_ID for ${soc}_${variant}\n"
                return 0
              fi
              if ! wget -nv "$url" -O "output/$soc.tgz"; then
                echo -e "Download failed: $url\n"
                return 0
              fi

              tar -xf "output/$soc.tgz" -C output
              fw="output/firmware.bin.$soc"
              if [ ! -f "$fw" ]; then
                echo "::error::${soc}_${variant}: the split package has no firmware.bin.$soc"
                return 1
              fi

              # The uImage: its magic, and its data size (big-endian, byte 12)
              # behind the 64-byte header. The squashfs starts at the next
              # 64 KiB and carries its own length (bytes_used, a little-endian
              # u64 at byte 40); rootfs_data starts at the 64 KiB after it --
              # the arithmetic of the kernel's mtdsplit and of sysupgrade.
              if [ "$(od -An -tx1 -N4 "$fw" | tr -d ' \n')" != 27051956 ]; then
                echo "::error::${soc}_${variant}: firmware.bin does not start with a uImage"
                return 1
              fi
              set -- $(od -An -tu1 -j12 -N4 "$fw")
              ksz=$(( ($1 << 24) | ($2 << 16) | ($3 << 8) | $4 ))
              k_kib=$(( (64 + ksz + 65535) / 65536 * 64 ))
              used=$(od -An -tu8 -j "$(( k_kib * 1024 + 40 ))" -N8 "$fw" | tr -d ' ')
              if [ "$(od -An -c -j "$(( k_kib * 1024 ))" -N4 "$fw" | tr -d ' ')" != "hsqs" ] || [ "${used:-0}" -le 0 ]; then
                echo "::error::${soc}_${variant}: no squashfs at ${k_kib} KiB, right after the uImage"
                return 1
              fi
              end_kib=$(( k_kib + (used + 65535) / 65536 * 64 ))
              fw_kib=$(( ( $(stat -c%s "$fw") + 1023 ) / 1024 ))
              ub_kib=$(( ( $(stat -c%s "output/$uboot") + 1023 ) / 1024 ))

              if [ "$ub_kib" -gt "$boot_kib" ]; then
                echo "::error::${soc}_${variant}: ${uboot} is ${ub_kib} KiB, the boot partition is ${boot_kib} KiB (the env sits behind it)"
                return 1
              fi
              if [ "$(( 64 + ksz ))" -gt "$(( read_kib * 1024 ))" ]; then
                echo "::error::${soc}_${variant}: the uImage is $(( 64 + ksz )) bytes, more than the ${read_kib} KiB a bootloader reads from the firmware offset"
                return 1
              fi
              if [ "$fw_kib" -gt "$end_kib" ]; then
                echo "::error::${soc}_${variant}: firmware.bin is ${fw_kib} KiB, its squashfs ends at ${end_kib} KiB: not a split image as the build packs it"
                return 1
              fi
              if [ "$(( off + end_kib + 64 ))" -gt "$nor" ]; then
                echo "::error::${soc}_${variant}: the image ends at $(( off + end_kib )) KiB, leaving no erase block for settings on a ${nor} KiB part"
                return 1
              fi

              # NOR canvas, erased (0xff): the boot image at 0, firmware.bin at
              # the end of the boot area. The env and rootfs_data stay erased,
              # so U-Boot boots its defaults and /init formats the overlay.
              dd if=/dev/zero bs=1K count="$nor" status=none | tr '\000' '\377' > "$release"
              dd if="output/$uboot" of="$release" bs=1K seek=0 conv=notrunc status=none
              dd if="$fw" of="$release" bs=1K seek="$off" conv=notrunc status=none

              # Backstop for the checks above: if any is ever wrong, the canvas
              # has grown past $nor and the file is no longer an image of the
              # part. Refuse to upload it rather than ship an unflashable
              # release.
              got=$(stat -c%s "$release")
              if [ "$got" -ne "$(( nor * 1024 ))" ]; then
                echo "::error::${soc}_${variant}: assembled ${release} is ${got} bytes, expected $(( nor * 1024 ))"
                return 1
              fi
              rm -rf output

              echo -e "Created: $release (firmware.bin ${fw_kib} KiB at ${off} KiB, rootfs_data from $(( off + end_kib )) KiB)\n"
            }

            for soc in $SIGMASTAR $ALLWINNER; do
              create $soc $soc lite
              create $soc $soc ultimate
            done

            for soc in $INGENIC; do
              create $soc ${soc:0:3} lite
              create $soc ${soc:0:3} ultimate
            done

            # The split NOR layout. hi3516cv6xx: one firmware.bin for every
            # DDR topology, the boot image per topology (cv610 DDR2-64M,
            # DDR3-128M, DDR3-512M; cv608 DDR2-64M; the 20g/00g boot images
            # carry the same DDR table as 20s/00s), lite on 8 MiB parts and
            # ultimate on 16 MiB. hi3519dv500: ultimate on 16 MiB, per board
            # (dmeb 6-layer, dmebpro 4-layer flyby).
            # create_split returns 1 for an image it refuses to assemble. This
            # step runs under Actions' default `bash -e`, so a bare call would
            # end the step at the first refusal -- with the Sigmastar, Allwinner
            # and Ingenic images already in target/ and the upload never
            # reached, nothing would publish for anyone. Collect instead: every
            # target gets its turn, what did assemble ships (Upload runs on
            # failure too), and the step still goes red so the refusal is seen.
            split_failed=
            for variant in lite ultimate; do
              case $variant in lite) nor=8192 ;; *) nor=16384 ;; esac
              create_split boot-hi3516cv610-10b-nor.bin hi3516cv6xx "$variant" hi3516cv610-ddr2-64m  "$nor" || split_failed=1
              create_split boot-hi3516cv610-20s-nor.bin hi3516cv6xx "$variant" hi3516cv610-ddr3-128m "$nor" || split_failed=1
              create_split boot-hi3516cv610-00s-nor.bin hi3516cv6xx "$variant" hi3516cv610-ddr3-512m "$nor" || split_failed=1
              create_split boot-hi3516cv608-nor.bin     hi3516cv6xx "$variant" hi3516cv608           "$nor" || split_failed=1
            done
            for board in dmeb dmebpro; do
              create_split boot-hi3519dv500-$board-nor.bin hi3519dv500 ultimate hi3519dv500-$board 16384 || split_failed=1
            done

            if [ -n "$split_failed" ]; then
              echo "::error::one or more split NOR images were refused (see above); the rest were assembled and will still be uploaded"
              exit 1
            fi

      # A refused split image fails the Prepare step on purpose, and the
      # images that did assemble must still ship -- so this runs on failure.
      # Not always(): that runs on cancellation too, and create_split lays down
      # the canvas, the boot image and firmware.bin as three separate writes,
      # so a cancelled run leaves a bootloader on an otherwise blank part.
      # Uploading that publishes an unflashable image indistinguishable from a
      # finished one. The ${{ }} is load-bearing: a bare `!` starts a YAML tag.
      #
      # The asset names are stable links, so the release body is what says
      # which build is inside; it was empty when #2679 found a day-old one.
      # It lists what this run assembled, by name: the action replaces files
      # and never removes them, so an image that was skipped or refused
      # tonight keeps an earlier build's file under this tag, and one
      # build_id for the whole release would claim that file too. Gated on
      # the resolve step: with no build resolved nothing is uploaded, and the
      # body would be rewritten to name none.
      - name: Describe the release
        if: ${{ !cancelled() && steps.resolve.outcome == 'success' }}
        env:
          BUILD_ID: ${{ steps.resolve.outputs.build_id }}
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          {
            echo "build_id=$BUILD_ID"
            echo "sha=$SHA"
            echo "assembled_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "Full NOR images: the kernel and rootfs of $BUILD_ID, U-Boot from the \`latest\` release."
            echo "Assembled by this run:"
            echo
            for f in target/*.bin; do
              if [ -e "$f" ]; then echo "- ${f#target/}"; fi
            done
            echo
            echo "An asset not listed was not rebuilt by this run and holds an earlier build."
          } > release-body.md
          cat release-body.md

      - name: Upload
        if: ${{ !cancelled() && steps.resolve.outcome == 'success' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: image
          make_latest: false
          body_path: release-body.md
          files: target/*.bin
