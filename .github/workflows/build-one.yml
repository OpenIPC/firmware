name: build-one
on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build (e.g. hi3516cv100_lite)'
        required: true
      commit:
        description: 'Commit SHA to build (optional; defaults to current branch HEAD). Use this from `git bisect run` or for one-off historic rebuilds.'
        required: false
      request_issue:
        description: 'Issue number of a firmware explorer build request (optional). Its "Defconfig fragment" is appended to the board defconfig, and the result is posted back on the issue.'
        required: false

jobs:
  resolve:
    name: Resolve commit
    runs-on: ubuntu-latest
    outputs:
      ref:       ${{ steps.r.outputs.ref }}
      short_sha: ${{ steps.r.outputs.short_sha }}
      tag_name:  ${{ steps.r.outputs.tag_name }}
    steps:
      - id: r
        env:
          REQUEST: ${{ inputs.request_issue }}
        run: |
          REF="${{ inputs.commit }}"
          [ -z "$REF" ] && REF="${{ github.sha }}"
          SHORT="$(printf '%s' "$REF" | cut -c1-7)"
          # A build request is its own release: same commit, different image.
          REQ=""
          if [ -n "$REQUEST" ]; then
            case "$REQUEST" in
              *[!0-9]*) echo "::error::request_issue must be an issue number, got '$REQUEST'"; exit 1 ;;
            esac
            REQ="-req${REQUEST}"
          fi
          if [ -n "${{ inputs.commit }}" ]; then
            TAG="nightly-bisect-${SHORT}${REQ}"
          else
            TAG="nightly-bisect-${SHORT}${REQ}-$(date -u +%Y%m%d%H%M%S)"
          fi
          echo "ref=$REF"               >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT"       >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG"          >> "$GITHUB_OUTPUT"
          echo "Building ${{ inputs.platform }} at $REF -> release tag $TAG"

  buildroot:
    name: Firmware (${{inputs.platform}})
    needs: resolve
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - name: Prepare firmware
        run: |
          echo "nameserver 8.8.8.8" | sudo tee /etc/resolv.conf
          echo CACHE_DATE=$(date +%m) >> ${GITHUB_ENV}
          # Same fix, and the same reason, as build.yml's: buildroot's DL_DIR
          # defaults to output/buildroot-$(BR_VER)/dl, so the output/dl this
          # workflow caches and prunes never existed. See the comment there.
          echo "BR2_DL_DIR=${GITHUB_WORKSPACE}/output/dl" >> ${GITHUB_ENV}

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: /tmp/ccache
          key: ${{inputs.platform}}-${{env.CACHE_DATE}}

      # Restore-only, deliberately. `dl-<month>` is one key shared with the
      # whole build.yml matrix, and actions/cache saves only on a key miss, so
      # whoever writes it first freezes that month's snapshot. This workflow
      # builds a single board on manual dispatch; letting it win that race would
      # pin the shared cache to one board's dependencies for the rest of the
      # month. It consumes the cache, it does not get to define it.
      - name: Restore dl cache
        uses: actions/cache/restore@v4
        with:
          path: output/dl
          key: dl-${{env.CACHE_DATE}}
          restore-keys: dl-

      - name: Refresh moving-ref package downloads
        run: |
          # Packages pinned to a moving ref keep a constant download filename. The dl
          # cache key is the month (date +%m) and actions/cache only saves on a key
          # miss, so that snapshot is frozen for weeks; buildroot then keeps reusing the
          # stale tarball and silently ships an old version. This is what desynced
          # majestic-webui from majestic (blanking settings labels; later a t31 lite
          # image shipped a pre-x-groups majestic vs the current webui — "No settings
          # groups in schema"). Drop both naming forms so buildroot re-fetches each run:
          #   - dash:  <pkg>-<ref>.tar.gz   e.g. majestic-webui-dist.tar.gz
          #   - dot:   <pkg>.<ref>.tar.bz2  e.g. majestic.t31.lite.master.tar.bz2
          # The dot form is majestic's S3 tarball — it LOOKS S3-pinned but is a moving
          # `master` build re-uploaded every majestic CI run, with no .hash to force a
          # refetch. Only genuinely content-addressed tarballs (semver / SHA) keep cache.
          #
          # Not silenced, for the reason given in build.yml: the suppression is
          # what let this run against a missing directory unnoticed.
          if [ -d "${BR2_DL_DIR}" ]; then
            find "${BR2_DL_DIR}" -type f -regextype posix-extended \
              -regex '.*[-.](HEAD|master|main|dist)\.tar\.(gz|bz2|xz)' \
              -print -delete
            # And the kernel, which the pattern above cannot see. Every board
            # fetches it from openipc/linux/archive/<branch>.tar.gz -- 122 of the
            # defconfigs -- so the filename is the BRANCH name, hisilicon-hi3516cv500
            # .tar.gz or ingenic-t31.tar.gz. That is a moving ref with a constant
            # name and no .hash, exactly the case this step exists for, but it
            # ends in none of the four words above. A kernel fix merged today
            # would otherwise wait for the monthly cache key to roll over before
            # any nightly built it. Buildroot keeps custom kernel tarballs in the
            # package's own dl subdirectory, so this reaches them and nothing else.
            if [ -d "${BR2_DL_DIR}/linux" ]; then
              find "${BR2_DL_DIR}/linux" -maxdepth 1 -type f -name '*.tar.gz' \
                -print -delete
            else
              echo "no kernel archive cached yet -- nothing to refresh."
            fi
          else
            echo "dl cache is cold (${BR2_DL_DIR} absent) -- nothing to refresh."
          fi

      # The request tooling comes from this workflow's own commit: `commit`
      # may predate it.
      - name: Checkout request tooling
        if: inputs.request_issue != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .ci
          sparse-checkout: .github/scripts

      # The issue body is untrusted text. build_request.sh accepts only
      # `# BR2_<NAME> is not set` lines from it and refuses the request on
      # anything else, so a request can switch symbols off and do nothing more.
      - name: Apply build request
        if: inputs.request_issue != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST:  ${{ inputs.request_issue }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          gh issue view "$REQUEST" -R "$GITHUB_REPOSITORY" --json body --jq .body > /tmp/request.md
          DEFCONFIG=$(find br-ext-*/configs -name "${PLATFORM}_defconfig" | head -n1)
          if [ -z "$DEFCONFIG" ]; then
            echo "::error::no defconfig for platform '$PLATFORM'"
            exit 1
          fi
          sh .ci/.github/scripts/build_request.sh apply /tmp/request.md "$DEFCONFIG" /tmp/request.symbols

      - name: Build firmware
        env:
          BUILD_ID:  ${{ needs.resolve.outputs.tag_name }}
          BUILD_SHA: ${{ needs.resolve.outputs.ref }}
        run: |
          export GIT_HASH=$(git rev-parse --short ${GITHUB_SHA})
          export GIT_BRANCH=${GITHUB_REF_NAME}
          echo GIT_HASH=${GIT_HASH} >> ${GITHUB_ENV}
          echo GIT_BRANCH=${GIT_BRANCH} >> ${GITHUB_ENV}

          mkdir -p /tmp/ccache
          ln -s /tmp/ccache ${HOME}/.ccache

          backoffs="30 60 120 300 600 1200"
          attempt=1
          for sleep_for in $backoffs ""; do
            make BOARD=${{inputs.platform}} && break
            if [ -z "$sleep_for" ]; then
              echo "::error::build failed after ${attempt} attempts"
              exit 1
            fi
            echo "::warning::attempt ${attempt} failed, retrying after ${sleep_for}s"
            sleep "$sleep_for"
            attempt=$((attempt + 1))
          done

          TIME=$(date -d @${SECONDS} +%M:%S)
          echo TIME=${TIME} >> ${GITHUB_ENV}

          NORFW=$(find output/images -name openipc*nor*)
          if [ -e ${NORFW} ]; then
            echo NORFW=${NORFW} >> ${GITHUB_ENV}
          fi

          NANDFW=$(find output/images -name openipc*nand*)
          if [ -e ${NANDFW} ]; then
            echo NANDFW=${NANDFW} >> ${GITHUB_ENV}
          fi

      - name: Verify kernel modules
        run: sh .github/scripts/check_target_modules.sh

      # A select elsewhere can switch a requested symbol straight back on;
      # say so rather than let the requester assume it is gone.
      - name: Check build request
        if: inputs.request_issue != ''
        run: |
          KEPT=$(sh .ci/.github/scripts/build_request.sh verify /tmp/request.symbols output/.config | tr '\n' ' ')
          echo "REQUEST_KEPT=${KEPT}" >> ${GITHUB_ENV}
          if [ -n "$KEPT" ]; then
            echo "::warning::still enabled after the request (selected by another package): ${KEPT}"
          fi

      - name: Upload firmware
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag_name }}
          prerelease: true
          body: |
            sha=${{ needs.resolve.outputs.ref }}
            short=${{ needs.resolve.outputs.short_sha }}
            platform=${{ inputs.platform }}
            one_off=true
            request_issue=${{ inputs.request_issue }}
            request_not_honoured=${{ env.REQUEST_KEPT }}
          files: |
            ${{env.NORFW}}
            ${{env.NANDFW}}

      - name: Reply on the build request
        if: always() && inputs.request_issue != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST:  ${{ inputs.request_issue }}
          PLATFORM: ${{ inputs.platform }}
          TAG:      ${{ needs.resolve.outputs.tag_name }}
          OUTCOME:  ${{ job.status }}
          KEPT:     ${{ env.REQUEST_KEPT }}
          RUN_URL:  ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            if [ "$OUTCOME" = success ]; then
              echo "Built \`${PLATFORM}\` with this request applied: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
              if [ -n "$KEPT" ]; then
                echo ""
                echo "Still enabled, because another package selects them: \`${KEPT% }\`"
              fi
            else
              echo "The build of \`${PLATFORM}\` for this request did not complete: ${RUN_URL}"
            fi
          } > /tmp/reply.md
          gh issue comment "$REQUEST" -R "$GITHUB_REPOSITORY" --body-file /tmp/reply.md
