name: build
on:
  pull_request:
    branches:
      - master
    # The default set is opened/synchronize/reopened. The selector skips draft
    # PRs, so without ready_for_review a PR opened as a draft would clear the
    # draft flag with no event to build on and sit there unbuilt.
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: '30 22 * * *'
  workflow_dispatch:

# Cancel a PR's earlier run when a new commit lands on it. The matrix is ~96
# jobs and there was no group here, so every push started another full matrix
# beside the one already running and both went to completion. Scheduled and
# dispatched runs are deliberately left alone: they write releases, and a
# cancelled publish leaves the nightly half-uploaded.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which boards can this change actually reach? Nearly every change here lands
  # in one SoC family, and the matrix was a fixed list, so a one-line fix to a
  # load script that reaches three cameras also rebuilt SigmaStar, Ingenic,
  # Rockchip and Xiongmai.
  #
  # The narrowing happens HERE, in a job that always runs -- never in a `paths:`
  # filter on the trigger. A filtered-out workflow does not run at all, so the
  # required "CI Gate" check would stay pending forever and the PR could never
  # be merged.
  select:
    name: Select boards
    # Same guard as preflight below.
    if: >-
      github.repository == 'OpenIPC/firmware' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && !github.event.repository.private)
    runs-on: ubuntu-latest
    outputs:
      matrix:      ${{ steps.pick.outputs.matrix }}
      needs-build: ${{ steps.pick.outputs.needs-build }}
    steps:
      - uses: actions/checkout@v4
      # Fails the PR that makes the selector disagree with the tree, rather
      # than letting a package quietly fall out of the matrix.
      - name: Check the selector still describes the tree
        run: python3 .github/scripts/ci-matrix.py --self-test
      - id: pick
        name: Pick the affected boards
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/ci-matrix.py

  preflight:
    name: Preflight
    # Guard rail for clones of this repo. A clone pushed to a new repository
    # (a private mirror, an internal re-host) inherits this file along with
    # its cron, and the full platform matrix — ~2000 runner-minutes a pass —
    # then runs on that owner's Actions bill: nightly via the schedule, and
    # again on every internal PR they open. Forks are partially covered
    # (GitHub disables scheduled workflows there), a fresh repository is not.
    #
    # The line is drawn where the minutes stop being free:
    #   - canonical repo: everything runs, unchanged
    #   - workflow_dispatch: an operator explicitly asked; runs anywhere
    #   - pull_request on a PUBLIC repo: free minutes (contributor PRs here
    #     run in this repo's context; within-fork PRs are public by
    #     construction) — runs
    #   - anything unattended or billed on a non-canonical repo — skips
    if: >-
      github.repository == 'OpenIPC/firmware' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && !github.event.repository.private)
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.gate.outputs.should_build }}
      head_sha:     ${{ steps.gate.outputs.head_sha }}
      short_sha:    ${{ steps.gate.outputs.short_sha }}
      build_id:     ${{ steps.gate.outputs.build_id }}
      built_at:     ${{ steps.gate.outputs.built_at }}
      webui_digest: ${{ steps.gate.outputs.webui_digest }}
    steps:
      - uses: actions/checkout@v4
      - id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          HEAD=$(git rev-parse HEAD)
          SHORT=$(git rev-parse --short HEAD)
          BUILD_ID="nightly-$(date -u +%Y%m%d)-${SHORT}"
          BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          NOTES_PREV=$(gh release view nightly --json body -q .body 2>/dev/null || true)
          PREV=$(printf '%s\n' "$NOTES_PREV" | sed -n 's/^sha=//p' | head -1)
          PREV_WEBUI=$(printf '%s\n' "$NOTES_PREV" | sed -n 's/^webui=//p' | head -1)

          # majestic-webui ships as a rolling `dist` release asset, so a WebUI fix
          # changes what the nightly would contain without ever moving this repo's
          # HEAD — on a quiet firmware tree the schedule would skip forever and the
          # fix would never reach an image. Compare the asset's content digest as
          # well. It is content-addressed, so a re-upload of identical bytes does
          # not force a pointless rebuild. An empty value (API hiccup, or an asset
          # with no digest) falls through to building: stale is worse than spare.
          WEBUI=$(gh api repos/OpenIPC/majestic-webui/releases/tags/dist \
                    --jq '.assets[]|select(.name=="majestic-webui-dist.tar.gz")|.digest // empty' \
                    2>/dev/null || true)

          if [ "${{ github.event_name }}" = "schedule" ] && [ "$PREV" = "$HEAD" ] \
             && [ -n "$WEBUI" ] && [ "$PREV_WEBUI" = "$WEBUI" ]; then
            echo "Skip: HEAD ($HEAD) already published as the latest nightly, majestic-webui dist unchanged ($WEBUI)."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Build: $BUILD_ID (event=${{ github.event_name }}, prev=$PREV, webui=$WEBUI, prev_webui=$PREV_WEBUI)"
            echo "should_build=true"  >> "$GITHUB_OUTPUT"
          fi
          echo "head_sha=$HEAD"   >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT" >> "$GITHUB_OUTPUT"
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          echo "built_at=$BUILT_AT" >> "$GITHUB_OUTPUT"
          echo "webui_digest=$WEBUI" >> "$GITHUB_OUTPUT"

  buildroot:
    name: Firmware
    needs: [preflight, select]
    if: >-
      needs.preflight.outputs.should_build == 'true' &&
      needs.select.outputs.needs-build == 'true'
    runs-on: ubuntu-latest
    env:
      BUILD_ID:  ${{ needs.preflight.outputs.build_id }}
      BUILD_SHA: ${{ needs.preflight.outputs.head_sha }}

    strategy:
      fail-fast: false
      # The board list lives in .github/scripts/ci-matrix.py, which is also
      # what narrows it. Everything except pull_request gets all of it.
      matrix: ${{ fromJson(needs.select.outputs.matrix) }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Prepare firmware
        run: |
          echo "nameserver 8.8.8.8" | sudo tee /etc/resolv.conf
          echo CACHE_DATE=$(date +%m) >> ${GITHUB_ENV}

      - name: Setup ccache
        if: github.event_name != 'pull_request'
        uses: actions/cache@v4
        with:
          path: /tmp/ccache
          key: ${{matrix.platform}}-${{env.CACHE_DATE}}

      - name: Restore ccache
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: /tmp/ccache
          key: ${{matrix.platform}}-${{env.CACHE_DATE}}

      - name: Setup dl cache
        if: github.event_name != 'pull_request'
        uses: actions/cache@v4
        with:
          path: output/dl
          key: dl-${{env.CACHE_DATE}}
          restore-keys: dl-

      - name: Restore dl cache
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: output/dl
          key: dl-${{env.CACHE_DATE}}
          restore-keys: dl-

      - name: Refresh moving-ref package downloads
        run: |
          # Packages pinned to a moving ref keep a constant download filename. The dl
          # cache key is the month (date +%m) and actions/cache only saves on a key
          # miss, so that snapshot is frozen for weeks; buildroot then keeps reusing the
          # stale tarball and the nightly silently ships an old version. This is what
          # desynced majestic-webui from majestic (blanking settings labels; later a t31
          # lite image shipped a pre-x-groups majestic vs the current webui — "No
          # settings groups in schema"). Drop both naming forms so buildroot re-fetches:
          #   - dash:  <pkg>-<ref>.tar.gz   e.g. majestic-webui-dist.tar.gz
          #   - dot:   <pkg>.<ref>.tar.bz2  e.g. majestic.t31.lite.master.tar.bz2
          # The dot form is majestic's S3 tarball — it LOOKS S3-pinned but is a moving
          # `master` build re-uploaded every majestic CI run, with no .hash to force a
          # refetch. Only genuinely content-addressed tarballs (semver / SHA) keep cache.
          find output/dl -type f -regextype posix-extended \
            -regex '.*[-.](HEAD|master|main|dist)\.tar\.(gz|bz2|xz)' \
            -print -delete 2>/dev/null || true

      - name: Build firmware
        run: |
          export GIT_HASH=$(git rev-parse --short ${GITHUB_SHA})
          export GIT_BRANCH=${GITHUB_REF_NAME}
          echo GIT_HASH=${GIT_HASH} >> ${GITHUB_ENV}
          echo GIT_BRANCH=${GIT_BRANCH} >> ${GITHUB_ENV}

          mkdir -p /tmp/ccache
          ln -s /tmp/ccache ${HOME}/.ccache

          # Backoffs give 7 attempts total. The longer tail (600, 1200) covers
          # the GitHub releases CDN / toolchain mirror flakes that took down
          # hi3516av100_ultimate on 2026-05-20 (run 26196546684) — 502s
          # storming for >10 min outlasted the previous 30/60/120/300 budget.
          #
          # Those backoffs are a bet that the failure is a flake. An image that
          # does not fit its partition is not one: it will not fit on the sixth
          # try either. hi3519v101_lite spent 50 minutes proving that on
          # 2026-08-18 (run 32138368965 — 4KB over a 5120KB cap), 38.5 of them
          # asleep, and the verdict landed at 14:39 for a PR that had been
          # merged at 13:14. The budget did not only waste an hour of runner
          # time, it pushed the answer past the point where anyone was still
          # looking at it. Deterministic failures stop on the first attempt.
          backoffs="30 60 120 300 600 1200"
          attempt=1
          buildlog=$(mktemp)

          # Name what broke, in a form the summariser can group on. Buildroot
          # says which package and which phase in exactly one line and nowhere
          # else:
          #   make[1]: *** [package/pkg-generic.mk:374: .../majestic-webui-dist/.stamp_target_installed] Error 1
          # The phase IS the class: .stamp_downloaded is a mirror or a 404 (the
          # #2036 family), anything after it is real code. The build directory
          # is <pkg>-<version> and splitting that back apart is ambiguous
          # (majestic-webui-dist), so it is reported whole.
          #
          # Without this an annotation says only "build failed", which is what
          # made 2026-08-12 (run 31649720825) cost 94 opened job logs to learn
          # that all 94 boards said the same thing. Last match wins: on a retry
          # the log holds every attempt, and the one that decided the outcome
          # is the last. Falls back to this repo's own Makefile target, which
          # is where repack and CHECK_SIZE fail.
          classify_failure() { # <logfile>
            local cause
            cause=$(sed -n \
              's|.*\*\*\* \[[^]]*: .*/build/\([^/]*\)/\.stamp_\([a-z_]*\)\].*|\1/\2|p' \
              "$1" | tail -1)
            if [ -z "$cause" ]; then
              cause=$(sed -n 's|^make[^:]*: \*\*\* \[\([^]]*\)\].*|\1|p' "$1" | tail -1)
            fi
            echo "${cause:-unclassified}"
          }
          for sleep_for in $backoffs ""; do
            # `set +e` around the pipeline, not because the default shell needs
            # it -- runner logs show `bash -e {0}`, errexit without pipefail, so
            # this pipeline reports tee's zero and never trips errexit -- but
            # because that is one `defaults: run: shell: bash` away from being
            # untrue. Under pipefail a failing make would abort the step right
            # here, and the whole retry budget below would silently stop
            # existing. PIPESTATUS[0] is make's own status either way.
            set +e
            make BOARD=${{matrix.platform}} 2>&1 | tee "${buildlog}"
            rc=${PIPESTATUS[0]}
            set -e
            if [ "${rc}" -eq 0 ]; then break; fi

            # CHECK_SIZE in the Makefile prints this, and only this, when an
            # image is larger than the partition it has to live in.
            if grep -q -- '-- size exceeded by:' "${buildlog}"; then
              echo "::error::${{matrix.platform}}: $(grep -m1 -o -- '-- size exceeded by:.*' "${buildlog}") — the image does not fit its partition, which retrying cannot change"
              exit 1
            fi

            cause=$(classify_failure "${buildlog}")
            if [ -z "$sleep_for" ]; then
              echo "::error::${{matrix.platform}}: build failed after ${attempt} attempts — ${cause}"
              exit 1
            fi
            # Named even on a retry that goes on to succeed. A flake the backoff
            # absorbs is invisible in a green run, and it is the thing that
            # predicts the nightly going red again -- the Build summary job
            # counts these warnings to report it.
            echo "::warning::${{matrix.platform}}: attempt ${attempt} failed (${cause}), retrying after ${sleep_for}s"
            sleep "$sleep_for"
            attempt=$((attempt + 1))
          done

          # Fitting with almost nothing to spare is the state this guard exists
          # for, and it looks exactly like fitting comfortably in a green run.
          # Promote the Makefile's line to an annotation so it outlives the log.
          # `|| true` because finding nothing here is the good outcome, and a
          # grep that matches nothing exits 1. Harmless under the current
          # `bash -e {0}` (the pipeline takes the while loop's zero), fatal the
          # day anything turns pipefail on -- every comfortably-sized board
          # would fail its build for having nothing to warn about.
          grep -- '-- headroom warning:' "${buildlog}" | while IFS= read -r line; do
            echo "::warning::${{matrix.platform}}: ${line#-- headroom warning: }"
          done || true
          rm -f "${buildlog}"

          TIME=$(date -d @${SECONDS} +%M:%S)
          echo TIME=${TIME} >> ${GITHUB_ENV}

          NORFW=$(find output/images -name openipc*nor*)
          if [ -e ${NORFW} ]; then
            echo NORFW=${NORFW} >> ${GITHUB_ENV}
          fi

          NANDFW=$(find output/images -name openipc*nand*)
          if [ -e ${NANDFW} ]; then
            echo NANDFW=${NANDFW} >> ${GITHUB_ENV}
          fi

      - name: Verify kernel modules
        run: sh .github/scripts/check_target_modules.sh

      # Both reports feed "Upload build artifacts" below, which never runs on a
      # pull_request -- so on a PR they were computed once per board and then
      # dropped on the floor, kconfiglib install and all.
      - name: Build size report
        if: github.event_name != 'pull_request'
        run: |
          make BOARD=${{matrix.platform}} size-report || \
            echo "::warning::size-report failed for ${{matrix.platform}}"
          SIZES=$(find output/images -name 'sizes.*.json' | head -1)
          if [ -e "$SIZES" ]; then
            echo "SIZES=$SIZES" >> ${GITHUB_ENV}
          fi

      - name: Build kconfig graph
        if: github.event_name != 'pull_request'
        run: |
          python3 -m pip install --user --break-system-packages kconfiglib || \
            { echo "::warning::kconfiglib install failed for ${{matrix.platform}}"; exit 0; }
          make BOARD=${{matrix.platform}} kconfig-graph || \
            { echo "::warning::kconfig-graph failed for ${{matrix.platform}}"; exit 0; }
          KCONFIG=$(find output/images -name 'kconfig-graph.*.json' | head -1)
          KHELP=$(find output/images -name 'kconfig-help.*.json' | head -1)
          if [ -e "$KCONFIG" ]; then echo "KCONFIG=$KCONFIG" >> ${GITHUB_ENV}; fi
          if [ -e "$KHELP" ]; then echo "KHELP=$KHELP" >> ${GITHUB_ENV}; fi

      # Hand the firmware + sidecars to the single `publish` job instead of
      # uploading to releases from here. ~90 matrix jobs all deleting and
      # re-uploading assets on the SAME shared `nightly`/`latest` releases at
      # once made the GitHub releases API return HTTP 500 ("Server Error") —
      # e.g. run 27108181857, where every build succeeded but 14 jobs went red
      # in their upload step. Consolidating every release write into one job
      # removes the concurrent-writer contention.
      - name: Upload build artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: fw-${{ matrix.platform }}
          if-no-files-found: ignore
          retention-days: 1
          path: |
            output/images/openipc*.tgz
            output/images/sizes.*.json
            output/images/kconfig-graph.*.json
            output/images/kconfig-help.*.json

      - name: Send binary
        if: github.event_name != 'pull_request' && env.NORFW
        run: |
          TG_MSG="Build: ${BUILD_ID}\nCommit: ${GIT_HASH}\nBranch: ${GIT_BRANCH}\nTime: ${TIME}\n\n"
          TG_ICON="\xE2\x9C\x85 GitHub Actions"
          TG_HEADER=$(echo -e ${TG_MSG}${TG_ICON})
          TG_TOKEN=${{secrets.TELEGRAM_TOKEN_BOT_OPENIPC}}
          TG_CHANNEL=${{secrets.TELEGRAM_CHANNEL_OPENIPC_DEV}}
          HTTP=$(curl -s -o /dev/null -w %{http_code} https://api.telegram.org/bot${TG_TOKEN}/sendDocument -F chat_id=${TG_CHANNEL} -F caption="${TG_HEADER}" -F document=@${NORFW})
          echo Telegram response: ${HTTP}

  # All release writes happen here, once, so only a SINGLE job ever touches the
  # shared `nightly`/`latest` releases (and the per-run dated release). The old
  # design had every matrix job upload to these releases, so ~90 jobs raced to
  # delete/re-upload assets on the same release and the GitHub releases API
  # returned HTTP 500 ("Server Error") under that concurrency — run
  # 27108181857 built fine on every board yet went red on 14 upload steps.
  #
  # Best-effort by design: publish whatever boards produced, even if some
  # failed (matches enrich_manifest.py, which indexes whatever assets exist).
  # Never runs on PRs (no artifacts) or on a scheduled no-op (buildroot skipped).
  publish:
    name: Publish releases
    needs: [preflight, buildroot]
    # The leading status function is load-bearing. A job whose `needs` failed is
    # skipped by default, and an `if:` lifts that only when it CONTAINS a status
    # function -- reading `needs.buildroot.result` inside the `contains()` below
    # does not count. So from #2184, which moved the release writes out of the
    # matrix jobs and into this one, until this line, any single failing board
    # skipped this job outright and the whole fleet's nightly went unwritten:
    # the 2026-08-23 nightly lost all 113 images to one board 4KB over its size
    # cap, and 2026-08-12 lost them the same way. Before #2184 each board
    # uploaded from its own matrix job, so a bad board took down only itself;
    # this restores that property without giving up the single-writer fix.
    #
    # `!cancelled()` rather than `always()`: the `contains()` already drops a
    # cancelled or skipped matrix, but a run cancelled AFTER a green matrix
    # would still start uploading under `always()`, and a half-written nightly
    # is the thing this job exists to avoid.
    if: >-
      !cancelled() &&
      github.event_name != 'pull_request' &&
      needs.preflight.outputs.should_build == 'true' &&
      contains(fromJSON('["success", "failure"]'), needs.buildroot.result)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # continue-on-error only so that a matrix where every board failed --
      # and therefore uploaded no fw-* artifact at all -- does not hard-fail
      # here before the gate can report why. Collect below turns that back
      # into a failure for every other case; without it, a broken download
      # produced an empty dist/, the count guard skipped publishing, and the
      # nightly went green having published nothing. Found by review on
      # OpenIPC/builder#121, whose publish job this one seeded.
      - name: Download build artifacts
        id: download
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: fw-*
          path: dist
          merge-multiple: true

      - name: Collect assets
        id: collect
        run: |
          mkdir -p dist
          # tr because wc pads its output on some platforms (BSD does, the
          # GNU coreutils on the runner does not) and a padded "     0" would
          # read as non-empty to the `!= '0'` guard below.
          count=$(find dist -type f | wc -l | tr -d '[:space:]')
          echo "Collected ${count} asset(s):"
          ls -la dist || true
          echo "count=${count}" >> "$GITHUB_OUTPUT"

          # A matrix that went green must have produced artifacts. Zero assets
          # after that means the download failed, not that there was nothing
          # to publish.
          if [ "${{ needs.buildroot.result }}" = "success" ]; then
            if [ "${{ steps.download.outcome }}" != "success" ]; then
              echo "::error::artifact download failed after a fully successful matrix"
              exit 1
            fi
            if [ "${count}" -eq 0 ]; then
              echo "::error::no artifacts collected although every board built"
              exit 1
            fi
          elif [ "${count}" -eq 0 ]; then
            echo "::notice::matrix failed and produced nothing; no release to write"
          else
            # The partial case this job was always meant to serve, unreachable
            # until the `!cancelled()` above. Say so out loud: the boards that
            # did not build keep their PREVIOUS image on nightly/latest, which
            # is the right outcome for a flasher but is invisible next to the
            # freshly-written ones.
            echo "::warning::partial publish: matrix failed, writing the ${count} asset(s) that did build; nightly and latest keep their previous image for every board that did not build — see the Build summary job for the per-board breakdown"
          fi

      # Drive the release writes ourselves instead of softprops/action-gh-release.
      # That action uploads assets CONCURRENTLY with no throttle/retry knob, so
      # firing ~390 asset writes at three releases tripped GitHub's per-actor
      # secondary rate limit — run 27314054079's "dated" step died after
      # uploading 350/393 assets with "You have exceeded a secondary rate limit".
      # Here every asset is uploaded one at a time, paced under the per-minute
      # mutation ceiling, with exponential backoff so a transient 403/secondary
      # limit is retried rather than failing the nightly. This is the third
      # iteration of the publish design: per-job uploads raced to HTTP 500 →
      # single-job concurrent uploads tripped the secondary limit → single-job
      # paced uploads (here). The single-writer property that fixed the 500s is
      # preserved; only the within-job upload rate changed.
      - name: Publish releases (paced, retry-aware)
        if: steps.collect.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BUILD_ID: ${{ needs.preflight.outputs.build_id }}
          HEAD_SHA: ${{ needs.preflight.outputs.head_sha }}
          SHORT_SHA: ${{ needs.preflight.outputs.short_sha }}
          BUILT_AT: ${{ needs.preflight.outputs.built_at }}
          WEBUI_DIGEST: ${{ needs.preflight.outputs.webui_digest }}
        run: |
          set -euo pipefail

          # Retry any gh invocation with exponential backoff. Covers the 403 /
          # 429 secondary-rate-limit response per GitHub's own guidance (pause,
          # back off, retry) — the asset uploads are the calls that hit it.
          gh_retry() {
            local n=0 max=6 delay=15
            until "$@"; do
              n=$((n + 1))
              if [ "$n" -ge "$max" ]; then
                echo "::error::gh failed after ${max} attempts: $*"
                return 1
              fi
              echo "::warning::gh attempt ${n} failed, sleeping ${delay}s before retry"
              sleep "$delay"
              delay=$((delay * 2))
            done
          }

          # Create the release at the built commit if it does not exist yet.
          ensure_release() { # <tag> [extra gh release create args...]
            local tag="$1"; shift
            if ! gh release view "$tag" >/dev/null 2>&1; then
              gh_retry gh release create "$tag" --target "$HEAD_SHA" --notes "$NOTES" "$@"
            fi
          }

          # Upload one asset at a time, pacing ~1/s to stay under the per-minute
          # content-mutation ceiling that triggers the secondary rate limit.
          upload_paced() { # <tag> <file>...
            local tag="$1"; shift
            local total=$# i=0
            for f in "$@"; do
              i=$((i + 1))
              echo "[${tag}] (${i}/${total}) ${f##*/}"
              gh_retry gh release upload "$tag" "$f" --clobber
              sleep 1
            done
          }

          # `webui=` is what the next preflight diffs against to notice a WebUI-only
          # change; drop the line rather than record an empty value, so a failed
          # lookup reads as "unknown" and builds instead of matching a future empty.
          NOTES=$(printf 'sha=%s\nshort=%s\nbuilt_at=%s\n' "$HEAD_SHA" "$SHORT_SHA" "$BUILT_AT")
          if [ -n "$WEBUI_DIGEST" ]; then
            NOTES=$(printf '%s\nwebui=%s\n' "$NOTES" "$WEBUI_DIGEST")
          fi

          # Full asset set (firmware images + sizes/kconfig sidecars) → dated.
          mapfile -t DATED < <(find dist -maxdepth 1 -type f | sort)
          # nightly/latest are firmware-delivery aliases for flashers, so ship
          # only the firmware images there — re-uploading the small JSON sidecars
          # to two more releases is pure rate-limit cost for no consumer.
          mapfile -t IMAGES < <(find dist -maxdepth 1 -type f -name 'openipc*.tgz' | sort)

          # --- dated: immutable per-build history ---
          ensure_release "$BUILD_ID" --prerelease --title "$BUILD_ID"
          upload_paced "$BUILD_ID" "${DATED[@]}"
          # Completion marker, uploaded LAST: its presence is the single downstream
          # signal that the dated release finished publishing. firmware-explorer's
          # prebuild gates ingestion on it so a rate-limit-truncated release is
          # never indexed as a complete build.
          printf '{"build_id":"%s","expected_assets":%s,"head_sha":"%s","built_at":"%s"}\n' \
            "$BUILD_ID" "${#DATED[@]}" "$HEAD_SHA" "$BUILT_AT" > dist/_manifest.json
          gh_retry gh release upload "$BUILD_ID" dist/_manifest.json --clobber

          # nightly and latest only ever move when there is firmware to move
          # them to. dist/ can be sidecars and no images -- one board that
          # produced a size report and no .tgz is enough -- and pointing the
          # two tags flashers pull from at a build with no images behind them
          # is worse than leaving them on yesterday's.
          if [ "${#IMAGES[@]}" -eq 0 ]; then
            echo "::warning::no images in this build; leaving nightly and latest where they are"
          else
            # --- rolling nightly: move tag + body to this build, refresh images ---
            ensure_release nightly
            gh_retry gh release edit nightly --notes "$NOTES"
            gh_retry gh api -X PATCH "repos/${GH_REPO}/git/refs/tags/nightly" -f sha="$HEAD_SHA" -F force=true
            upload_paced nightly "${IMAGES[@]}"

            # --- latest: legacy alias ---
            ensure_release latest
            gh_retry gh api -X PATCH "repos/${GH_REPO}/git/refs/tags/latest" -f sha="$HEAD_SHA" -F force=true
            upload_paced latest "${IMAGES[@]}"
          fi

  # "The nightly is red" does not say whether one board broke or ninety-four.
  # On 2026-08-12 (run 31649720825) a majestic-webui fixup did a bare `rm` on
  # two files upstream had deleted, and 94 of 99 boards failed in the same
  # place -- which took opening 94 job logs to establish, because the run's
  # entire output was the word "failure". #2271 asked whether one failing cell
  # should still fail the run. It should (see ci-gate below); what was missing
  # was being able to read the run at a glance, and that is this job.
  #
  # It also reports what the retry loop absorbs. A board that went green on its
  # third attempt is invisible in a green run, and the same cause exhausting
  # its budget is exactly what turns the nightly red -- that was 30% of runs
  # before #2036.
  #
  # REPORTING ONLY. It must never fail the run: a bug here turning a good
  # nightly red is precisely the mistake #2271 decided not to make. Hence the
  # `||` below, and hence its deliberate absence from ci-gate's `needs`. What
  # keeps it honest instead is `build-summary.py --self-test` in lint.yml,
  # which is a merge gate -- a reworded annotation would otherwise reduce this
  # to reporting nothing, and reporting nothing looks like a quiet night.
  #
  # Not gated on `publish`: this describes the matrix, and waiting for the
  # release writer would only delay the answer by the length of ~390 paced
  # uploads.
  summary:
    name: Build summary
    # preflight for the build id in the title, buildroot for the matrix itself.
    # `select` is not listed: buildroot already depends on it, so a selector
    # failure skips the matrix and this job with it.
    needs: [preflight, buildroot]
    # Same guard as the jobs above. `always()` so it still reports when the
    # matrix failed -- which is the case it exists for -- but not when there
    # was nothing to build, where it would have nothing to say.
    if: >-
      always() && needs.buildroot.result != 'skipped' &&
      (github.repository == 'OpenIPC/firmware' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && !github.event.repository.private))
    runs-on: ubuntu-latest
    # Declared rather than inherited, so the token stays narrow whatever the
    # repo or org default becomes: the run's jobs and the scheduled runs behind
    # the streaks (actions), the annotations those jobs emitted (checks), and
    # the checkout (contents). It writes nothing anywhere.
    permissions:
      actions: read
      checks: read
      contents: read
    # Roughly 130 API requests and a couple of minutes at worst. The default is
    # six hours, which is how a step that hangs rather than fails holds a
    # runner and tells nobody.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Summarise the matrix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/build-summary.py \
            --run-id "${{ github.run_id }}" \
            --event "${{ github.event_name }}" \
            --build-id "${{ needs.preflight.outputs.build_id }}" \
          || echo "::warning::build summary failed; the matrix result stands as reported"

  # Single umbrella status check that reflects the whole build matrix, so the
  # branch-protection required-checks list does not need one hardcoded
  # "Firmware (<board>)" context per board (adding/removing a board no longer
  # requires a settings change). Make "CI Gate" the required check on master
  # instead of the per-board contexts.
  ci-gate:
    name: CI Gate
    needs: [select, preflight, buildroot, publish]
    # always() so the gate still reports when a needed job fails -- but not on a
    # run whose preflight the guard above deliberately skipped, where it would
    # read preflight=skipped and turn a saved build into a red run. Upstream the
    # added disjunct is true, so this reduces to always().
    if: >-
      always() && (github.repository == 'OpenIPC/firmware' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && !github.event.repository.private))
    runs-on: ubuntu-latest
    steps:
      - name: Require preflight + firmware matrix to succeed
        run: |
          echo "select=${{ needs.select.result }} preflight=${{ needs.preflight.result }} buildroot=${{ needs.buildroot.result }} publish=${{ needs.publish.result }}"
          if [ "${{ needs.select.result }}" != "success" ]; then
            echo "::error::board selection did not succeed"; exit 1
          fi
          if [ "${{ needs.preflight.result }}" != "success" ]; then
            echo "::error::preflight did not succeed"; exit 1
          fi
          # Check the matrix against what select and preflight actually asked
          # for. Blanket-accepting 'skipped' here would mean a selector bug that
          # narrowed a real change down to nothing reads as a green PR.
          #
          # ONE FAILING CELL OUT OF ~99 STILL FAILS THE RUN, and that is a
          # decision rather than the default it started as -- #2271 asked, and
          # this is the answer:
          #
          #   - The nightly's product is a COMPLETE set of images. A board that
          #     failed leaves `nightly` and `latest` pointing at yesterday's
          #     image for it, so whoever flashes that board silently gets stale
          #     firmware. The run really did not deliver; green would be a lie.
          #   - The transient classes are already absorbed upstream of here.
          #     Anything that reaches this line survived seven attempts across
          #     ~38 minutes of backoff (#2036), which is no longer a blip.
          #   - This gate serves pull requests too. Relaxing the matrix rule to
          #     quieten the nightly would relax branch protection with it.
          #
          # The real complaint behind #2271 -- that "red" does not say whether
          # one board or ninety-four broke -- is answered by the Build summary
          # job above, not by changing the colour here.
          if [ "${{ needs.select.outputs.needs-build }}" = "true" ] && \
             [ "${{ needs.preflight.outputs.should_build }}" = "true" ]; then
            if [ "${{ needs.buildroot.result }}" != "success" ]; then
              echo "::error::firmware matrix result=${{ needs.buildroot.result }} — see the Build summary job for the per-board breakdown"; exit 1
            fi
            echo "firmware matrix OK (success)"
          else
            # Nothing in the change reaches a build, the PR is still a draft, or
            # the schedule found nothing new since the last nightly.
            if [ "${{ needs.buildroot.result }}" != "skipped" ]; then
              echo "::error::firmware matrix ran when it should not have (${{ needs.buildroot.result }})"; exit 1
            fi
            echo "firmware matrix OK (no boards to build)"
          fi
          # publish is skipped on PRs and on scheduled no-ops; only a real
          # failure of the single release-writer should fail the gate.
          case "${{ needs.publish.result }}" in
            success|skipped) echo "publish OK (${{ needs.publish.result }})" ;;
            *) echo "::error::publish result=${{ needs.publish.result }}"; exit 1 ;;
          esac
