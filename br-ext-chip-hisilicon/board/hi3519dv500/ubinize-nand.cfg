# hi3519dv500 NAND: rootfs (UBIFS, the kernel inside as /boot/fitImage) +
# rootfs_data, in the `ubi` partition after OpenIPC U-Boot's boot (768k) and
# env (256k). U-Boot boots it with `ubifsmount ubi0:rootfs; ubifsload
# /boot/fitImage; bootm` and root=ubi0:rootfs.
#
# No vol_size: the rootfs volume is exactly as big as its image, and the
# overlay takes everything else. sysupgrade resizes both when it writes a new
# rootfs, so neither size is a limit a future image has to fit.
[rootfs]
mode=ubi
vol_id=0
vol_type=dynamic
vol_name=rootfs
vol_alignment=1
image=BR2_ROOTFS_UBIFS_PATH

[rootfs_data]
mode=ubi
vol_id=1
vol_type=dynamic
vol_name=rootfs_data
vol_alignment=1
vol_size=2MiB
vol_flags=autoresize
